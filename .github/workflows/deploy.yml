# Deploy the static build to GitHub Pages on every push to main.
# The app is a single page driven by URL query params, so no SPA routing config is needed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Regression tests
        # 六套纯逻辑回归（样式标注/SimBrief 解析/搜索/动画/时区时间线/本地持久化），失败即不部署
        run: npm test

      - name: Static map resource and road parity tests
        run: npm run test:static-map

      - name: Build
        env:
          VITE_STATIC_MAP: '1'
        # Project pages are served from https://<owner>.github.io/<repo>/, so the
        # build must prefix asset URLs with the repo name. Build-time flag only:
        # local dev keeps serving from the root.
        run: npx tsc -b && npx vite build --base=/${{ github.event.repository.name }}/

      - name: Size budget
        # 首屏性能预算（scripts/check-size.mjs）：超预算则部署失败
        run: npm run size

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
